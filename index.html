<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>아테나 석상</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140703; }
  .card {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 52%, #6e2f0e 0%, #33150a 50%, #120602 100%);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  /* 받침대 아래쪽을 어둠 속으로 풀어 준다 */
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; pointer-events: none; background: linear-gradient(to bottom, rgba(18, 6, 2, 0), rgba(18, 6, 2, 0.95)); }
</style>
</head>
<body>
<div class="card" id="card"><canvas id="c"></canvas></div>
<script src="three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 60);
  const card = document.getElementById("card");
  const BASE_Y = 0.9; // 받침대 윗면 높이 = 석상 발 높이
  const TARGET = new THREE.Vector3(0, 2.12, 0);
  // 카메라는 석상보다 아래에서 45도로 올려다보고, 옆으로도 45도 돌아가 있다
  const VIEW = { az: Math.PI / 4, el: -Math.PI / 4, zoom: 1 };
  const DEFAULT_VIEW = { az: VIEW.az, el: VIEW.el, zoom: 1 };
  // 확인용: ?ty=높이&zoom=배율&el=각도(도)&az=각도(도)
  (function () { const q = new URLSearchParams(location.search); if (q.has("ty")) TARGET.y = +q.get("ty"); if (q.has("zoom")) VIEW.zoom = +q.get("zoom"); if (q.has("el")) VIEW.el = +q.get("el") * Math.PI / 180; if (q.has("az")) VIEW.az = +q.get("az") * Math.PI / 180; })();

  function placeCamera() {
    const d = 14;
    cam.position.set(
      TARGET.x + d * Math.cos(VIEW.el) * Math.sin(VIEW.az),
      TARGET.y + d * Math.sin(VIEW.el),
      TARGET.z + d * Math.cos(VIEW.el) * Math.cos(VIEW.az)
    );
    cam.lookAt(TARGET);
  }
  function resize() {
    const w = card.clientWidth, h = card.clientHeight, a = w / h;
    renderer.setSize(w, h, false);
    const H = Math.max(2.0, 1.25 / a) / VIEW.zoom;
    cam.left = -H * a / 2; cam.right = H * a / 2; cam.top = H / 2; cam.bottom = -H / 2;
    cam.updateProjectionMatrix();
  }

  // ---------- 보조 함수 ----------
  function makeInterp(tab) {
    const n = tab.length, m = [];
    for (let i = 0; i < n; i++) {
      const a = tab[Math.max(0, i - 1)], b = tab[Math.min(n - 1, i + 1)];
      m.push((b[1] - a[1]) / ((b[0] - a[0]) || 1));
    }
    return function (y) {
      if (y <= tab[0][0]) return tab[0][1];
      if (y >= tab[n - 1][0]) return tab[n - 1][1];
      let i = 1; while (y > tab[i][0]) i++;
      const y0 = tab[i - 1][0], y1 = tab[i][0], h = y1 - y0, t = (y - y0) / h, t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * tab[i - 1][1] + (t3 - 2 * t2 + t) * h * m[i - 1] + (-2 * t3 + 3 * t2) * tab[i][1] + (t3 - t2) * h * m[i];
    };
  }
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const gau = (dx, dy, sx, sy) => Math.exp(-(dx * dx) / (2 * sx * sx) - (dy * dy) / (2 * sy * sy));

  function marbleTexture() {
    const s = 512, c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    g.fillStyle = "#ebdfca"; g.fillRect(0, 0, s, s);
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 300; i++) {
      const x = rnd() * s, y = rnd() * s, r = 14 + rnd() * 80;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rnd() < 0.62 ? "rgba(125,98,66,0.085)" : "rgba(255,250,236,0.08)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.strokeStyle = "rgba(150,128,102,0.15)"; g.lineWidth = 1;
    for (let i = 0; i < 16; i++) {
      g.beginPath(); let x = rnd() * s, y = rnd() * s; g.moveTo(x, y);
      for (let k = 0; k < 10; k++) { x += (rnd() - 0.4) * 60; y += (rnd() - 0.5) * 60; g.lineTo(x, y); }
      g.stroke();
    }
    for (let i = 0; i < 1800; i++) {
      g.fillStyle = "rgba(95,72,50," + (rnd() * 0.13) + ")";
      g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  }
  const tex = marbleTexture();
  const marble = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.8, roughness: 0.82, metalness: 0, side: THREE.DoubleSide });

  // 뒤로 모아 올린 쪽머리
  (function () {
    const bun = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), marbleHair);
    bun.scale.set(0.046, 0.036, 0.032); bun.position.set(0, -0.05, -0.098); bun.rotation.x = 0.3;
    add(bun, head);
  })();

  // 목: 두개골 뒤쪽 아래에서 시작해 어깨로 이어지는 단면 쌓기
  const neckGeo = surface(50, 72, (v, th) => {
    const y = 1.385 + v * 0.2;
    const fl = Math.exp(-v * 7), a = 0.05 + 0.032 * fl - 0.005 * v, b = 0.052 + 0.03 * fl - 0.006 * v, zc = 0.002 + 0.016 * v;
    return [Math.sin(th) * a + 0.004, y, Math.cos(th) * b + zc];
  });
  add(new THREE.Mesh(neckGeo, marble));
  // 목 옆 근육: 귀 뒤에서 쇄골 사이 오목한 곳으로
  [-1, 1].forEach(sd => {
    const A = new THREE.Vector3(sd * 0.044, 1.56, -0.01), B = new THREE.Vector3(sd * 0.013, 1.43, 0.047);
    const len = A.distanceTo(B);
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.0105, len - 0.021, 6, 14), marble);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
    m.scale.set(1, 1, 0.55);
    add(m);
  });
  // 어깨 위로 흘러내린 땋은 머리
  (function braid() {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.03, 1.575, -0.07),
      new THREE.Vector3(-0.085, 1.53, -0.045),
      new THREE.Vector3(-0.108, 1.46, 0.0),
      new THREE.Vector3(-0.135, 1.36, 0.075),
      new THREE.Vector3(-0.128, 1.25, 0.132),
      new THREE.Vector3(-0.112, 1.15, 0.15)
    ]);
    const N = 17;
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), pt = curve.getPoint(t);
      const s = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), marbleHair);
      const r = 0.031 - 0.013 * t;
      s.scale.set(r * 1.1, r * 1.4, r);
      s.position.copy(pt);
      s.position.x += (i % 2 ? 0.008 : -0.008);
      s.rotation.z = (i % 2 ? 0.45 : -0.45);
      add(s);
    }
  })();

  // ---------- 팔: 관절 구 없이 하나로 이어지는 면 ----------
  function sweep(curve, radiusAt, flute, NT, NR) {
    const frames = curve.computeFrenetFrames(NT, false);
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= NT; i++) {
      const t = i / NT, P = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i], r = radiusAt(t);
      for (let j = 0; j <= NR; j++) {
        const a = 2 * Math.PI * j / NR;
        const k = flute ? 1 + flute.amp * (Math.abs(Math.sin(flute.n * a / 2)) - 0.5) * flute.mask(t) : 1;
        const c = Math.cos(a) * r * k, s = Math.sin(a) * r * k;
        pos.push(P.x + N.x * c + B.x * s, P.y + N.y * c + B.y * s, P.z + N.z * c + B.z * s);
        uv.push(j / NR * 2, t * 2);
      }
    }
    for (let i = 0; i < NT; i++) for (let j = 0; j < NR; j++) {
      const a = i * (NR + 1) + j, b = a + NR + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  function arm(S, E, W, roll) {
    const V = (p) => new THREE.Vector3(p[0], p[1], p[2]);
    const s = V(S), e = V(E), w = V(W);
    const up = e.clone().sub(s).normalize(), fo = w.clone().sub(e).normalize();
    const pre = e.clone().addScaledVector(up, -0.075), post = e.clone().addScaledVector(fo, 0.075);
    const arc = pre.clone().add(post).multiplyScalar(0.5).lerp(e, 0.55);
    const curve = new THREE.CatmullRomCurve3([s, pre, arc, post, w], false, "centripetal");
    const rad = makeInterp([[0, 0.052], [0.3, 0.042], [0.5, 0.036], [0.72, 0.032], [1, 0.026]]);
    const a = add(new THREE.Mesh(sweep(curve, rad, null, 60, 28), marble));
    // 소매: 어깨 위쪽부터 팔 중간까지 덮는 짧은 옷자락
    const pts = [];
    for (let i = 0; i <= 5; i++) pts.push(curve.getPointAt(0.52 * i / 5));
    const sleeve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
    const srad = makeInterp([[0, 0.062], [0.5, 0.068], [0.85, 0.072], [1, 0.074]]);
    add(new THREE.Mesh(sweep(sleeve, srad, { n: 18, amp: 0.1, mask: (t) => sm(0.1, 0.5, t) }, 40, 48), marble));
    // 소매 끝단 두께
    const endP = sleeve.getPointAt(1), endT = sleeve.getTangentAt(1);
    const hem = new THREE.Mesh(new THREE.TorusGeometry(0.0735, 0.0065, 12, 64), marble);
    hem.position.copy(endP);
    hem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), endT);
    add(hem);
    // 손목에서 이어지는 손
    const dir = w.clone().sub(curve.getPointAt(0.93)).normalize();
    const hand = new THREE.Group();
    hand.position.copy(w);
    hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    hand.rotateY(roll);
    statue.add(hand);
    const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 22, 16), marble);
    palm.scale.set(0.04, 0.05, 0.019); palm.position.y = 0.04;
    add(palm, hand);
    for (let i = 0; i < 4; i++) {
      const L = [0.036, 0.043, 0.04, 0.032][i];
      const fg = new THREE.Group();
      fg.position.set((i - 1.5) * 0.0115, 0.084, 0);
      fg.rotation.x = 0.28; fg.rotation.z = (i - 1.5) * -0.06;
      const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.0078, L, 4, 8), marble);
      f.position.y = L * 0.5 + 0.004;
      add(f, fg);
      hand.add(fg);
    }
    const th = new THREE.Mesh(new THREE.CapsuleGeometry(0.0088, 0.03, 4, 8), marble);
    th.position.set(-0.038, 0.052, 0.006); th.rotation.z = 0.75;
    add(th, hand);
  }
  // 석상의 오른팔: 팔꿈치를 굽혀 손을 가슴 앞으로
  arm([-0.19, 1.31, 0.0], [-0.258, 1.06, 0.05], [-0.14, 1.17, 0.225], -1.2);
  // 왼팔: 몸 옆으로 늘어뜨림
  arm([0.19, 1.31, 0.0], [0.278, 1.05, 0.01], [0.278, 0.8, 0.07], 1.2);

  // ---------- 받침대 ----------
  function slab(w, h, d, y, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || plinthMat);
    m.position.y = y; m.castShadow = true; m.receiveShadow = true; scene.add(m);
  }
  slab(1.12, 0.12, 1.12, 0.06);
  slab(0.84, 0.64, 0.84, 0.44);
  slab(1.0, 0.07, 1.0, 0.775);
  slab(1.06, 0.09, 1.06, 0.855);

  // ---------- 조명 ----------
  scene.add(new THREE.HemisphereLight(0xffcfa0, 0x4a2410, 0.42));
  const key = new THREE.DirectionalLight(0xffa458, 2.9);
  key.position.set(-1.8, 0.9, 3.2);
  key.target.position.set(0, 2.0, 0);
  scene.add(key.target);
  key.castShadow = true;
  key.shadow.mapSize.set(3072, 3072);
  key.shadow.camera.left = -1.7; key.shadow.camera.right = 1.7; key.shadow.camera.top = 1.7; key.shadow.camera.bottom = -1.7;
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 14;
  key.shadow.bias = -0.0003; key.shadow.normalBias = 0.006;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd8b0, 1.2);
  rim.position.set(2.6, 3.6, -2.4);
  scene.add(rim);
  const fire = new THREE.PointLight(0xff6a1a, 2.2, 7, 1.6);
  fire.position.set(-1.1, 1.1, 1.5);
  scene.add(fire);
  const fill = new THREE.DirectionalLight(0xe0803a, 1.3);
  fill.position.set(2.4, -0.6, 2.2);
  scene.add(fill);

  // ---------- 불씨 ----------
  const EN = 44;
  const ePos = new Float32Array(EN * 3), eSpd = new Float32Array(EN), ePh = new Float32Array(EN);
  function resetEmber(i, fresh) {
    const a = Math.random() * Math.PI * 2, r = 0.4 + Math.random() * 1.2;
    ePos[i * 3] = Math.cos(a) * r; ePos[i * 3 + 2] = Math.sin(a) * r;
    ePos[i * 3 + 1] = fresh ? Math.random() * 3.6 : 0.2;
    eSpd[i] = 0.14 + Math.random() * 0.3; ePh[i] = Math.random() * 6.28;
  }
  for (let i = 0; i < EN; i++) resetEmber(i, true);
  const eGeo = new THREE.BufferGeometry();
  eGeo.setAttribute("position", new THREE.BufferAttribute(ePos, 3));
  const dot = (function () { const c = document.createElement("canvas"); c.width = c.height = 32; const g = c.getContext("2d"); const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, "rgba(255,220,150,1)"); gr.addColorStop(0.4, "rgba(255,150,50,0.8)"); gr.addColorStop(1, "rgba(255,120,30,0)"); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })();
  const embers = new THREE.Points(eGeo, new THREE.PointsMaterial({ map: dot, color: 0xffb468, size: 6, sizeAttenuation: false, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(embers);

  // ---------- 조작: 끌어서 돌리기, 휠 확대, 두 번 누르면 처음 각도 ----------
  let drag = null;
  canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    VIEW.az -= (e.clientX - drag.x) * 0.006;
    VIEW.el = Math.min(1.35, Math.max(-1.35, VIEW.el + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
    placeCamera();
  });
  canvas.addEventListener("pointerup", () => { drag = null; });
  canvas.addEventListener("wheel", e => { e.preventDefault(); VIEW.zoom = Math.min(2.5, Math.max(0.6, VIEW.zoom * (e.deltaY < 0 ? 1.08 : 0.925))); resize(); }, { passive: false });
  canvas.addEventListener("dblclick", () => { Object.assign(VIEW, DEFAULT_VIEW); placeCamera(); resize(); });
  window.addEventListener("resize", resize);

  placeCamera(); resize();
  let last = performance.now(), t0 = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000;
    const fl = Math.sin(t * 7.3) * 0.1 + Math.sin(t * 13.1) * 0.07;
    key.intensity = 2.9 + fl;
    fire.intensity = 2.2 + fl * 3;
    for (let i = 0; i < EN; i++) {
      ePos[i * 3 + 1] += eSpd[i] * dt;
      ePos[i * 3] += Math.sin(t * 1.3 + ePh[i]) * 0.0012;
      if (ePos[i * 3 + 1] > 3.8) resetEmber(i, false);
    }
    eGeo.attributes.position.needsUpdate = true;
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__ready = true;
})();
</script>
